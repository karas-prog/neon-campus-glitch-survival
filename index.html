<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NEON CAMPUS: GLITCH SURVIVAL</title><link rel="stylesheet" href="src/styles.css"></head><body><main id="game" tabindex="0"><canvas id="scene"></canvas><div id="hud" class="hidden"><div class="hud-row"><div class="box">WAVE <b id="wave">1</b> · <span id="timer">00:35</span></div><div class="box"><span id="role-name">SCOUT</span> · SCORE <b id="score">0</b></div></div><div class="meters"><div><label>HP</label><i id="hp"></i></div><div><label>XP</label><i id="xp"></i></div></div><div class="box objective" id="objective">SURVIVE THE WAVE</div><div id="toast"></div></div><section id="intro" class="overlay"><div class="card"><p class="code">NEON CAMPUS // GLITCH SURVIVAL</p><h1>CHOOSE<br><span>YOUR ROLE</span></h1><p>Выбери специализацию для зачистки кампусного контура.</p><div id="roles" class="roles"><button class="role active" data-role="scout"><strong>СКАУТ</strong><br>Скорость +35%, быстрый рывок</button><button class="role" data-role="curator"><strong>КУРАТОР</strong><br>HP +70, магнит Data Shards</button><button class="role" data-role="analyst"><strong>АНАЛИТИК</strong><br>Урон +8, дальность сканера</button><button class="role" data-role="sysadmin"><strong>СИСАДМИН</strong><br>+1 импульс, скорость атаки</button></div><div class="controls"><span>WASD / стрелки — движение</span><span>Shift — рывок</span><span>Автоатака — сканер сам бьёт ближайшую цель</span></div><button id="start">INITIATE RUN</button></div></section><section id="upgrade" class="overlay hidden"><div class="card"><p class="code">SYSTEM UPDATE</p><h2>ВЫБЕРИ МОДУЛЬ</h2><div id="upgrade-list"></div></div></section><section id="end" class="overlay hidden"><div class="card"><p class="code">RUN TERMINATED</p><h1 id="end-title">SYSTEM<br><span>OVERLOADED</span></h1><p id="end-text"></p><button id="restart">CHANGE ROLE</button></div></section></main><script src="src/main.js"></script></body>
